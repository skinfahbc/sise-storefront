name: SISE free validation
on:
  push:
    branches:
      - integration/kifara-security-backup
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'admin.html'
      - 'supabase/migrations/**'
      - 'docs/archive/kifara-applied-migrations/**'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'SECURITY.md'
      - 'BACKUP.md'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Validate all imported workflow YAML files
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          files = %w[
            .github/workflows/sise-backup.yml
            .github/workflows/sise-platform-backup.yml
            .github/workflows/sise-restore-check.yml
            .github/workflows/sise-restore-test.yml
            .github/workflows/sise-security-validation.yml
          ]
          files.each { |file| YAML.load_file(file); puts "PASS: #{file}" }
          RUBY
      - name: Check platform backup script syntax
        run: python3 -m py_compile .github/scripts/sise-platform-backup.py
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = []
          for attrs, body in re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, re.I | re.S):
              if not re.search(r'\bsrc\s*=', attrs, re.I) and body.strip():
                  scripts.append(body)
          if not scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          for i, script in enumerate(scripts, 1):
              Path(f"/tmp/sise-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/sise-inline-*.js; do node --check "$file"; done
      - name: Prepare isolated PostgreSQL fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/checkout-fixture.sql
      - name: Apply migration in disposable PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/archive/kifara-applied-migrations/20261112111000_sise_secure_checkout.sql
      - name: Apply post-deploy permission lockdown migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/archive/kifara-applied-migrations/20261112112000_sise_lockdown_direct_orders.sql
      - name: Apply admin, chat and storage hardening migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/archive/kifara-applied-migrations/20261112130000_sise_admin_chat_storage_hardening.sql
      - name: Apply guest chat rate-limit migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/archive/kifara-applied-migrations/20261112143000_sise_chat_rate_limit.sql
      - name: Check admin inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('admin.html').read_text(encoding='utf-8')
          scripts = []
          for attrs, body in re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, re.I | re.S):
              if not re.search(r'\bsrc\s*=', attrs, re.I) and body.strip():
                  scripts.append(body)
          if not scripts:
              raise SystemExit('No inline JavaScript found in admin.html')
          for i, script in enumerate(scripts, 1):
              Path(f'/tmp/sise-admin-inline-{i}.js').write_text(script, encoding='utf-8')
          PY
          for file in /tmp/sise-admin-inline-*.js; do node --check "$file"; done
      - name: Apply public Data API grants hardening migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113083642_sise_public_api_grants_hardening.sql
      - name: Test checkout, stock, tracking, chat rate limits and permissions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/checkout-smoke.sql
