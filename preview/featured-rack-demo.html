<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SISE | منتخب‌های کیف</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:Vazirmatn,Tahoma,sans-serif}.top{height:62px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.logo{font:30px Georgia,serif;letter-spacing:5px}.top small{font-size:10px;color:#777}.wrap{max-width:1120px;margin:auto;padding:30px 18px 50px}.eyebrow{text-align:center;font-size:10px;letter-spacing:3px;color:#999}.heading{text-align:center;font-size:23px;font-weight:500;margin:8px 0 28px}.rack-scene{height:300px;position:relative;overflow:hidden;margin:0 auto;max-width:960px}.railbar{position:absolute;top:35px;left:4%;right:4%;height:5px;border-radius:5px;background:linear-gradient(#e8d3a5,#a8874d,#e5c98c);box-shadow:0 3px 5px #0002}.railbar:before,.railbar:after{content:"";position:absolute;top:-10px;width:4px;height:20px;background:#b3925a}.railbar:before{left:0}.railbar:after{right:0}.items{height:100%;display:flex;align-items:flex-start;justify-content:center;gap:clamp(10px,4vw,48px);padding-top:38px;transition:transform .35s}.item{border:0;background:transparent;flex:0 0 clamp(95px,16vw,150px);height:245px;position:relative;cursor:pointer;opacity:.52;transform:scale(.78);transition:.35s;display:flex;align-items:center;flex-direction:column}.item.active{opacity:1;transform:scale(1.12);z-index:2}.hook{height:40px;width:18px;border:2px solid #c7a66c;border-bottom:0;border-radius:14px 14px 0 0;position:relative;margin-top:-1px}.hook:after{content:"";position:absolute;bottom:-2px;left:6px;width:4px;height:12px;background:#c7a66c}.bag{height:160px;width:100%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 10px 7px #0002)}.bag svg{height:100%;width:100%;overflow:visible}.item.active .bag{height:175px}.rack-caption{text-align:center;color:#aaa;font-size:9px;margin-top:-2px}.selector{display:flex;justify-content:center;align-items:center;gap:20px;margin:10px 0 26px}.arrow{width:34px;height:34px;border:1px solid #ddd;border-radius:50%;background:white;font-size:19px;cursor:pointer;color:#555}.dots{display:flex;gap:9px}.dot{width:6px;height:6px;border-radius:50%;background:#ddd;border:0;padding:0}.dot.on{background:#171717;transform:scale(1.35)}.product{text-align:center;min-height:125px}.product h2{font-size:17px;font-weight:500;margin:0 0 8px}.sub{font-size:11px;color:#999}.prices{margin:14px 0 12px;font-size:14px}.prices del{font-size:11px;color:#aaa;margin-left:10px}.off{font-size:10px;color:#fff;background:#171717;padding:4px 8px;margin-right:8px}.view{border:1px solid #222;background:#171717;color:white;padding:9px 30px;font:11px Vazirmatn;cursor:pointer}.hint{text-align:center;font-size:10px;color:#aaa;margin-top:22px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:white;width:min(340px,100%);padding:28px;text-align:center}.box button{border:0;background:#111;color:white;padding:8px 22px;font:12px Vazirmatn}
@media(max-width:600px){.top{height:54px;padding:0 16px}.logo{font-size:25px}.wrap{padding:25px 8px 40px}.heading{margin-bottom:18px}.rack-scene{height:270px}.items{gap:3px;padding-top:38px}.item{flex-basis:27vw;height:215px}.item.active{transform:scale(1.08)}.bag{height:140px}.item.active .bag{height:155px}.hook{height:34px}.product h2{font-size:16px}}
</style></head>
<body>
<header class="top"><small>منتخب‌های ویژه</small><div class="logo">SISE</div><small>MORE THAN A BAG</small></header>
<main class="wrap"><div class="eyebrow">THE SISE BAG EDIT</div><h1 class="heading">منتخب‌های SISE</h1>
<section class="rack-scene" aria-label="رگال کیف‌ها"><div class="railbar"></div><div class="items" id="items"></div></section>
<div class="selector"><button class="arrow" id="prev" aria-label="قبلی">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next" aria-label="بعدی">›</button></div>
<section class="product"><h2 id="name"></h2><div class="sub" id="desc"></div><div class="prices"><del id="old"></del><b id="price"></b><span class="off" id="off"></span></div><button class="view" onclick="showDemo()">مشاهده محصول</button></section>
<div class="hint">برای جابه‌جایی بین کیف‌ها، رگال را لمس کن یا بکش</div></main>
<div class="modal" id="modal"><div class="box"><h3 id="modalname"></h3><p>این پیش‌نمایش مستقل است. در نسخه اصلی، مشاهده محصول به صفحه جزئیات واقعی کیف متصل می‌شود.</p><button onclick="document.getElementById('modal').classList.remove('show')">بستن</button></div></div>
<script>
const products=[
{name:'کیف دستی کلاسیک',desc:'مشکی · چرم بافت‌دار · یراق طلایی',price:'۱۰٬۹۰۰٬۰۰۰ تومان',old:'۱۲٬۹۰۰٬۰۰۰',off:'۱۵٪ تخفیف',c1:'#171717',c2:'#050505',shape:'box'},
{name:'کیف دوشی مینیمال',desc:'کرم عاجی · بند زنجیری طلایی',price:'۹٬۹۰۰٬۰۰۰ تومان',old:'۱۱٬۹۰۰٬۰۰۰',off:'۱۷٪ تخفیف',c1:'#e7ddc9',c2:'#b7a78d',shape:'flap'},
{name:'کیف هلالی شب',desc:'مشکی براق · فرم هلالی',price:'۱۲٬۵۰۰٬۰۰۰ تومان',old:'۱۴٬۹۰۰٬۰۰۰',off:'۱۶٪ تخفیف',c1:'#242321',c2:'#090909',shape:'moon'},
{name:'کیف دستی نود',desc:'بژ گرم · چرم دانه‌دار',price:'۱۱٬۵۰۰٬۰۰۰ تومان',old:'۱۳٬۹۰۰٬۰۰۰',off:'۱۷٪ تخفیف',c1:'#bda58d',c2:'#8e7763',shape:'box'},
{name:'کیف مینی رز',desc:'صورتی چرک · ظریف و سبک',price:'۷٬۸۰۰٬۰۰۰ تومان',old:'۸٬۹۰۰٬۰۰۰',off:'۱۲٪ تخفیف',c1:'#c99e9e',c2:'#916c70',shape:'flap'}
];
let current=0;
function art(p,i){let handle=p.shape==='moon'?'M62 76 C58 5 142 5 138 76': 'M sixty';let body=p.shape==='moon'?'<path d="M25 83 Q100 48 175 83 Q165 160 100 166 Q35 160 25 83Z"':'<path d="M28 72 Q100 58 172 72 L162 165 Q100 181 38 165Z"';return `<svg viewBox="0 0 200 190" role="img"><defs><linearGradient id="grad${i}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${p.c1}"/><stop offset="1" stop-color="${p.c2}"/></linearGradient></defs><path d="${handle.replace('M sixty','M62 72 C58 10 142 10 138 72')}" fill="none" stroke="#c5a36b" stroke-width="8" stroke-linecap="round"/>${body.replace('','')}<path d="M28 72 Q100 58 172 72 L162 165 Q100 181 38 165Z" fill="url(#grad${i})" stroke="#8d7653" stroke-width="2"/><path d="M30 87 Q100 99 170 87" fill="none" stroke="#d8bd88" stroke-width="2"/><rect x="91" y="101" width="18" height="22" rx="3" fill="#c6a56d"/><circle cx="100" cy="112" r="3" fill="#f3dfb7"/></svg>`}
function render(){const host=document.getElementById('items');host.innerHTML='';products.forEach((p,i)=>{const b=document.createElement('button');b.className='item'+(i===current?' active':'');b.innerHTML='<span class="hook"></span><span class="bag">'+art(p,i)+'</span><span class="rack-caption">SISE</span>';b.onclick=()=>{current=i;render()};host.appendChild(b)});document.getElementById('dots').innerHTML=products.map((p,i)=>'<button class="dot '+(i===current?'on':'')+'" aria-label="محصول '+(i+1)+'" onclick="current='+i+';render()"></button>').join('');let p=products[current];document.getElementById('name').textContent=p.name;document.getElementById('desc').textContent=p.desc;document.getElementById('price').textContent=p.price;document.getElementById('old').textContent=p.old;document.getElementById('off').textContent=p.off}
document.getElementById('prev').onclick=()=>{current=(current+products.length-1)%products.length;render()};document.getElementById('next').onclick=()=>{current=(current+1)%products.length;render()};function showDemo(){document.getElementById('modalname').textContent=products[current].name;document.getElementById('modal').classList.add('show')}
let startX=0;document.getElementById('items').addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});document.getElementById('items').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>35){current=(current+(dx<0?1:products.length-1))%products.length;render()}},{passive:true});render();
</script></body></html>
