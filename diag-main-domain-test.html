<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SISE main-domain timing test</title>
<style>body{font:16px system-ui;max-width:850px;margin:24px auto;padding:0 16px;background:#f7f7f7;color:#222}h2{font-size:22px}.hint{line-height:1.9}.item{background:white;border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#666;font-size:13px}button{font:inherit;padding:10px 18px;border:0;border-radius:8px;background:#222;color:white}</style></head>
<body><h2>تست ارتباط با دامنهٔ اصلی SISE</h2>
<p class="hint">این صفحه فقط چند درخواست خواندنی به دامنهٔ اصلی می‌فرستد. هیچ کد فروشگاهی اجرا نمی‌شود و هیچ داده‌ای تغییر نمی‌کند. زمان هر درخواست از شروع تا دریافت پاسخ اولیه ثبت می‌شود.</p>
<button id="run">اجرای دوباره تست</button><p class="muted" id="meta"></p><div id="out"></div>
<script>
const targets=[
 ["صفحه اصلی (index.html)","https://sisestore.ir/index.html"],
 ["robots.txt","https://sisestore.ir/robots.txt"],
 ["sitemap.xml","https://sisestore.ir/sitemap.xml"],
 ["صفحه اصلی با پارامتر تازه","https://sisestore.ir/index.html?diag-main-domain=1"]
];
const out=document.getElementById("out"),meta=document.getElementById("meta"),btn=document.getElementById("run");
async function run(){
 btn.disabled=true;out.innerHTML="";const start=performance.now();meta.textContent="شروع: "+new Date().toISOString()+" | مرورگر: "+navigator.userAgent;
 for(const [name,url] of targets){
  const t=performance.now();const item=document.createElement("div");item.className="item";item.textContent=name+" : در حال بررسی...";out.appendChild(item);
  try{
   const r=await fetch(url+(url.includes("?")?"&":"?")+"_t="+Date.now()+"_"+Math.random().toString(36).slice(2),{mode:"no-cors",cache:"no-store",redirect:"follow"});
   item.textContent=name+"\nنتیجه: پاسخ دریافت شد (نوع پاسخ: "+r.type+")\nزمان تا دریافت پاسخ: "+Math.round(performance.now()-t)+" ms\nتوجه: به‌دلیل درخواست بین‌دامنه‌ای، کد وضعیت HTTP در این تست قابل خواندن نیست.";
  }catch(e){item.textContent=name+"\nخطا: "+e.name+": "+e.message+"\nزمان تا خطا: "+Math.round(performance.now()-t)+" ms";}
 }
 meta.textContent+="\nکل زمان: "+Math.round(performance.now()-start)+" ms";btn.disabled=false;
}
btn.addEventListener("click",run);run();
</script></body></html>
