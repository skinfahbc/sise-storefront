<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SISE | پیش‌نمایش رگال منتخب‌ها</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#fff9ef,#eee5d8 65%,#e8ddcf);color:#34271e;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:26px}
main{width:min(1040px,100%);background:rgba(255,255,255,.48);border:1px solid #fff9;border-radius:28px;padding:clamp(18px,4vw,42px);box-shadow:0 25px 80px #61452a18;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:28px}small{letter-spacing:3px;color:#a47c50;font:600 10px Arial}h1{font-size:clamp(23px,4vw,34px);margin:8px 0 5px;font-weight:600}header p{margin:0;color:#927c68;font-size:13px}.hint{font-size:11px;color:#9b8065;white-space:nowrap}
.frame{position:relative;padding:30px 2% 0;margin:0 -2%;}.bar{height:9px;border-radius:9px;background:linear-gradient(#f4dfb6,#9e7544 45%,#6d4b2e 55%,#d6b27c);box-shadow:0 5px 9px #4c321d35;position:relative;z-index:3}.bar:before{content:"";position:absolute;inset:-4px 0 auto;height:3px;background:#fff9;border-radius:4px}
.rail{height:330px;display:flex;align-items:stretch;justify-content:center;padding:0 3%;position:relative;overflow:visible;isolation:isolate}
.bag{--w:1;position:relative;flex:var(--w) 1 0;min-width:0;border:0;background:none;padding:0;cursor:pointer;transition:flex .55s cubic-bezier(.2,.8,.2,1),transform .45s;z-index:1;outline:0}
.bag:before{content:"";position:absolute;top:-1px;left:50%;height:27px;width:2px;background:linear-gradient(90deg,#6e4e30,#f3d7a5,#805b36);transform:translateX(-50%);z-index:2}
.hook{position:absolute;top:-8px;left:50%;width:15px;height:14px;border:2px solid #a98453;border-bottom-color:transparent;border-radius:12px 12px 0 0;transform:translateX(-50%);z-index:4}
.photo{position:absolute;inset:20px -34% 0;display:flex;align-items:center;justify-content:center;overflow:visible;transition:transform .5s;transform-origin:50% 8%}
.photo svg{height:100%;width:100%;max-width:220px;overflow:visible;filter:drop-shadow(0 13px 9px #3d281c30);transition:filter .5s,transform .5s}
.bag.active{--w:3.1;z-index:5;transform:translateY(-5px)}.bag.near{--w:1.45}.bag.active .photo{transform:scale(1.08)}.bag.active svg{filter:drop-shadow(0 20px 13px #3d281c40)}
.bag:not(.active) .photo svg{transform:scale(.9)}.bag:not(.active){opacity:.88}
@keyframes sway{0%,100%{rotate:-1.3deg}50%{rotate:1.4deg}}.bag .photo{animation:sway 4.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.4s)}.bag.active .photo{animation-duration:5.4s}
.info{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:18px;text-align:center;flex-wrap:wrap}.info h2{font-size:18px;margin:0 0 6px}.info p{font-size:12px;color:#8f7b68;margin:0}.price{font-size:14px;font-weight:bold;color:#75502e;white-space:nowrap}.actions{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}.arrow{border:1px solid #d8c6af;background:#fff8;color:#795b3b;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.dots{display:flex;gap:7px}.dot{width:6px;height:6px;border:0;border-radius:9px;background:#cbb89f;padding:0;cursor:pointer}.dot.on{width:20px;background:#99734c}
.note{text-align:center;color:#aa967e;font-size:10px;margin-top:24px}
@media(max-width:600px){body{padding:12px}main{border-radius:20px;padding:18px 12px}.hint{display:none}.rail{height:265px;padding-inline:0}.photo{inset:22px -55% 0}.photo svg{max-width:190px}.bag.active .photo{transform:scale(1.04)}.frame{padding-top:25px}.info{gap:9px}.info h2{font-size:15px}}
</style></head><body><main>
<header><div><small>SISE CURATED</small><h1>منتخب‌های SISE</h1><p>کیف‌های منتخب روی رگال SISE</p></div><span class="hint">برای انتخاب، روی کیف برو یا لمس کن</span></header>
<div class="frame"><div class="bar"></div><div class="rail" id="rail">
<button class="bag" style="--i:0" aria-label="کیف آوین"><i class="hook"></i><div class="photo"><svg viewBox="0 0 180 230"><path d="M55 68V49Q55 15 90 15t35 34v19" fill="none" stroke="#8b623b" stroke-width="8"/><path d="M30 72Q90 60 150 72L160 211Q90 228 20 211Z" fill="#a96835" stroke="#69452a" stroke-width="3"/><path d="M35 83Q90 69 145 83L148 193Q90 207 32 193Z" fill="#c18a51"/><path d="M43 88Q90 78 137 88" stroke="#e4b77e" stroke-width="3" fill="none"/><path d="M83 108h15v17H83z" fill="#d7b06e"/><path d="M30 150Q90 166 155 150" fill="none" stroke="#80502c" opacity=".5" stroke-width="2"/></svg></div></button>
<button class="bag" style="--i:1" aria-label="کیف ماهرخ"><i class="hook"></i><div class="photo"><svg viewBox="0 0 180 230"><path d="M47 83Q90 18 133 83" fill="none" stroke="#a7834e" stroke-width="5"/><rect x="20" y="82" width="140" height="116" rx="25" fill="#702b39" stroke="#4e1b27" stroke-width="3"/><path d="M25 103Q90 120 155 103" fill="none" stroke="#b46d73" stroke-width="4"/><path d="M80 133h20v22H80z" rx="4" fill="#d8b56e"/><path d="M30 185Q90 198 150 185" fill="none" stroke="#401720" stroke-width="3"/></svg></div></button>
<button class="bag active" style="--i:2" aria-label="کیف نگار"><i class="hook"></i><div class="photo"><svg viewBox="0 0 180 230"><path d="M47 75Q45 17 90 17t45 58" fill="none" stroke="#765331" stroke-width="7"/><path d="M23 83Q90 67 157 83L150 205Q90 220 30 205Z" fill="#b98242" stroke="#77502d" stroke-width="3"/><path d="M30 94Q90 80 150 94L145 144Q90 160 35 144Z" fill="#d2a15f"/><path d="M36 143Q90 158 144 143" fill="none" stroke="#714b2c" stroke-width="3"/><path d="M80 116h20v19H80z" fill="#d9b86f"/><path d="M36 184Q90 197 144 184" fill="none" stroke="#e5bd80" stroke-width="2"/></svg></div></button>
<button class="bag" style="--i:3" aria-label="کیف پرنیا"><i class="hook"></i><div class="photo"><svg viewBox="0 0 180 230"><path d="M48 75V49Q48 15 90 15t42 34v26" fill="none" stroke="#6b4a2e" stroke-width="8"/><path d="M25 78h130l-8 132H33Z" fill="#242321" stroke="#111" stroke-width="3"/><path d="M35 91h110l-6 105H41Z" fill="#3b3935"/><path d="M32 116h116" stroke="#8d795e" stroke-width="3"/><rect x="81" y="126" width="18" height="18" rx="3" fill="#c6a36a"/><path d="M44 190h92" stroke="#5d554a" stroke-width="2"/></svg></div></button>
<button class="bag" style="--i:4" aria-label="کیف بهار"><i class="hook"></i><div class="photo"><svg viewBox="0 0 180 230"><path d="M57 57Q90 12 123 57" fill="none" stroke="#795431" stroke-width="6"/><path d="M43 64Q90 83 137 64L150 199Q90 224 30 199Z" fill="#725039" stroke="#4b3323" stroke-width="3"/><path d="M39 81Q90 98 141 81" fill="none" stroke="#c39b69" stroke-width="4"/><path d="M48 105Q90 117 132 105" fill="none" stroke="#4a3020" stroke-width="2"/><circle cx="90" cy="130" r="9" fill="#d5b16f"/><path d="M35 189Q90 207 145 189" fill="none" stroke="#ad8152" stroke-width="3"/></svg></div></button>
<button class="bag" style="--i:5" aria-label="کیف سیمین"><i class="hook"></i><div class="photo"><svg viewBox="0 0 180 230"><path d="M42 88Q90 14 138 88" fill="none" stroke="#7b5939" stroke-width="7"/><path d="M24 87Q90 70 156 87L150 207Q90 220 30 207Z" fill="#6f2730" stroke="#42191f" stroke-width="3"/><path d="M30 100Q90 114 150 100L145 151Q90 165 35 151Z" fill="#8f3a43"/><circle cx="90" cy="132" r="10" fill="#d6b36e"/><path d="M36 190Q90 204 144 190" fill="none" stroke="#bc7b75" stroke-width="2"/></svg></div></button>
<button class="bag" style="--i:6" aria-label="مینی‌بگ لیلا"><i class="hook"></i><div class="photo"><svg viewBox="0 0 180 230"><path d="M50 80Q90 20 130 80" fill="none" stroke="#a27a4c" stroke-width="5"/><rect x="31" y="78" width="118" height="115" rx="27" fill="#d6a0a1" stroke="#a9787c" stroke-width="3"/><path d="M38 99Q90 112 142 99" fill="none" stroke="#f1c6c5" stroke-width="4"/><rect x="82" y="125" width="16" height="17" rx="3" fill="#d8b46e"/><path d="M40 181Q90 193 140 181" fill="none" stroke="#b97e82" stroke-width="2"/></svg></div></button>
</div></div>
<div class="info"><div><h2 id="name">کیف کراس‌بادی «نگار»</h2><p id="desc">انتخاب ویژه SISE · چرم و یراق طلایی</p></div><strong class="price" id="price">۳٬۶۰۰٬۰۰۰ تومان</strong></div>
<div class="actions"><button class="arrow" id="prev">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next">›</button></div>
<p class="note">این صفحه پیش‌نمایش مستقلِ ظاهر و رفتار رگال است؛ به فروشگاه زنده یا اطلاعات سفارش متصل نیست.</p>
</main>
<script>
const bags=[...document.querySelectorAll('.bag')],names=['کیف دوشی چرم طبیعی «آوین»','کیف دستی مجلسی «ماهرخ»','کیف کراس‌بادی «نگار»','کیف اداری «پرنیا»','کیف سطلی «بهار»','کیف دوشی «سیمین»','مینی‌بگ «لیلا»'],prices=['۴٬۸۵۰٬۰۰۰','۲٬۹۵۰٬۰۰۰','۳٬۶۰۰٬۰۰۰','۵٬۲۰۰٬۰۰۰','۳٬۱۵۰٬۰۰۰','۴٬۱۰۰٬۰۰۰','۱٬۸۹۰٬۰۰۰'];let active=2;
const dots=document.getElementById('dots');bags.forEach((b,i)=>{const d=document.createElement('button');d.className='dot';d.onclick=()=>select(i);dots.append(d);b.onmouseenter=()=>select(i);b.onclick=()=>{select(i);document.getElementById('desc').textContent='برای مشاهده و سفارش، این بخش در فروشگاه اصلی باز می‌شود.'};});
function select(n){active=(n+bags.length)%bags.length;bags.forEach((b,i)=>{b.classList.toggle('active',i===active);b.classList.toggle('near',Math.abs(i-active)===1)});[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===active));document.getElementById('name').textContent=names[active];document.getElementById('price').textContent=prices[active]+' تومان';document.getElementById('desc').textContent='انتخاب ویژه SISE · کیف منتخب روی رگال';}
document.getElementById('prev').onclick=()=>select(active-1);document.getElementById('next').onclick=()=>select(active+1);select(active);
</script></body></html>
